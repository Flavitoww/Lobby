name: Lobby quality checks
on:
  pull_request:
  push:
    branches: [feat/meridian-unified-desk-atlas]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check meridian.js
          node --check atlas/app.js
          node --check atlas/meridian-atlas.js
          node --check atlas/earth.js
          node --check atlas/canvas-globe.js
          node --check api/lib.js
          node --check api/live.js
          node --check api/explore.js
          node --check api/news.js
          node --check api/twitch.js
          node --check discover/discover.js
          node --check shared/site-header.js
          node --check profile/profile.js
          node --check section/section.js
          node --check api/orgs.js
          node --check api/catalog.js
          node --check api/related.js
          node --check api/fast-orgs.js
          node --check api/team.js
          node --check tests/api.test.cjs
          node --check tests/earth.test.cjs
          node --check tests/navigation.test.cjs
          node --check tests/client-smoke.test.cjs
          node --check tests/catalog.test.cjs
      - name: Run API regression tests
        run: node --test tests/*.test.cjs
