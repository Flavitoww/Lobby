<style>
/* Mise en page : globe plein cadre sur un ciel qui suit l'heure, panneau d'information à droite (sous le globe sur téléphone), recherche et jeux en haut. */
:root {
  --bg: #0d0e10;
  --surface: #141518;
  --surface-2: #1b1c20;
  --line: #28292e;
  --fg: #e6eaee;
  --muted: #92949b;
  --accent: #ff3b3b; --on-accent: #ffffff; --live: #f4f4f2; --ring: #ff3b3b;
  --ok: #7bc9a0;
  --warn: #e0b36a;
  --sea: #0d1217;
  --land: #1e2832;
  --land-on: #27425e;
  --land-hover: #34577b;
  --stroke: #3a4756;
  --atmo: #4a78a8;
  --monument: #a9bdd1;
  --font-ui: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5f7; --surface: #ffffff; --surface-2: #eaeef2; --line: #d6dce2;
    --fg: #12171c; --muted: #5d6a76; --accent: #e02f2f; --on-accent: #ffffff; --live: #15181c; --ok: #2f8a5c; --warn: #a8741a;
    --sea: #dfe6ed; --land: #c3ced8; --land-on: #8fb0d1; --land-hover: #7aa3cb;
    --stroke: #f3f5f7; --atmo: #8fb0d1; --monument: #5f7a94;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #eaeef2; --line: #d6dce2;
  --fg: #12171c; --muted: #5d6a76; --accent: #e02f2f; --on-accent: #ffffff; --live: #15181c; --ok: #2f8a5c; --warn: #a8741a;
  --sea: #dfe6ed; --land: #c3ced8; --land-on: #8fb0d1; --land-hover: #7aa3cb;
  --stroke: #f3f5f7; --atmo: #8fb0d1; --monument: #5f7a94;
  color-scheme: light;
}

html, body { height: 100%; overflow-x: hidden; max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); }
.flag { flex: 0 0 auto; width: 18px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(128, 138, 150, .35); vertical-align: -1px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto minmax(0, 1fr); }

/* Barre du haut */
.top { grid-column: 1 / -1; position: relative; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row, .filters {
  display: flex; align-items: center; gap: 12px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.top-row { padding-block: 12px 10px; position: relative; z-index: 30; }
.ticker, .filters { position: relative; z-index: 1; }
.filters { padding-block: 0 12px; }
.brand { font-weight: 600; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 400; }
.search { position: relative; flex: 1; min-width: 0; max-width: 580px; }
.search input {
  box-sizing: border-box; width: 100%; height: 42px; padding: 0 44px 0 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; outline-offset: 0;
}
.search input::placeholder { color: var(--muted); }
.search kbd {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 11px var(--font-mono);
  color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; pointer-events: none;
}
#results {
  z-index: 40; position: absolute; left: 0; right: 0; top: 48px; margin: 0; padding: 6px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .35); max-height: 56vh; overflow: auto;
}
.res { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.res[aria-selected="true"], .res:hover { background: var(--surface-2); }
.res-i { grid-row: 1 / span 2; display: grid; place-items: center; }
.res-l { grid-column: 2; font-weight: 500; overflow-wrap: anywhere; }
.res-t { grid-row: 1 / span 2; grid-column: 3; font: 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.res-m { grid-column: 2; color: var(--muted); font-size: 12px; }
.res-h, .res-empty { padding: 8px 10px; color: var(--muted); font-size: 12px; }
.res-h { font: 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; flex: 0 0 auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--muted);
}
.icon-btn:hover, .icon-btn[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }

/* Niveaux et jeux */
.seg { display: inline-flex; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); height: 46px; }
.seg-btn { background: none; border: 0; padding: 0 16px; font: 500 13px var(--font-mono); color: var(--muted); }
.seg-btn:hover { color: var(--fg); }
.seg-btn[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.chips { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); padding-right: 40px; }
.chips::-webkit-scrollbar { display: none; }
.grp { flex: 0 0 auto; font: 500 10px var(--font-mono); letter-spacing: .1em; color: var(--muted); padding: 0 6px 0 10px; border-left: 1px solid var(--line); }
.chip {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-weight: 500; font-size: 14px; color: var(--muted); white-space: nowrap;
}
.chip:hover { color: var(--fg); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.tile {
  flex: 0 0 auto; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--bg);
  border: 1px solid var(--line); font: 600 11px var(--font-mono); letter-spacing: -.02em; color: var(--muted);
}
.tile.t1 { border-color: var(--accent); color: var(--accent); }
.tile.t2 { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); color: color-mix(in srgb, var(--accent) 70%, var(--muted)); }
.tile.sm { width: 24px; height: 24px; font-size: 9.5px; border-radius: 7px; }

/* Scène 3D */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--stage-bg, var(--bg)); transition: background .6s; }
#globe { position: absolute; inset: 0; cursor: grab; }
#globe:active { cursor: grabbing; }
.fail { margin: 0; padding: 24px; color: var(--muted); }
.stage-ui { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; max-width: calc(100% - 32px); }
.stage-ui > * { pointer-events: auto; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost-btn { background: color-mix(in srgb, var(--surface) 86%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
.ghost-btn:hover { border-color: var(--accent); }
.ghost-btn .mono { color: var(--muted); font-size: 12px; margin-left: 6px; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }

.pin {
  display: inline-flex; align-items: center; gap: 7px; box-sizing: border-box; padding: 5px 10px 5px 8px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--accent); color: var(--fg);
  font: 500 11px/1 var(--font-mono); box-shadow: 0 3px 12px rgba(0, 0, 0, .4); transition: opacity .2s;
}
.pin::before { content: ""; display: none; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.pin:hover { background: var(--surface-2); }
.far .pin.cluster span, .far .pin.cluster b { display: none; }
.lbl-country { font: 600 11px var(--font-ui); font-stretch: 80%; letter-spacing: .22em; text-transform: uppercase; color: rgba(236, 238, 242, .5); text-shadow: 0 1px 4px #000, 0 0 10px #000; pointer-events: none; white-space: nowrap; }
.lbl-country.has { color: rgba(236, 238, 242, .78); }
.far .lbl-country { font-size: 10px; letter-spacing: .16em; }
.lbl-town { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--font-ui); color: rgba(236, 238, 242, .72); text-shadow: 0 1px 4px #000, 0 0 8px #000; pointer-events: none; white-space: nowrap; }
.lbl-town::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: rgba(236, 238, 242, .7); }
.far .pin { padding: 0; width: var(--dot, 7px); height: var(--dot, 7px); gap: 0; font-size: 0; justify-content: center; }
.far .pin::before { display: block; }
.far .pin .flag { display: none; }
.pin.cluster b { font: 600 10px var(--font-mono); background: var(--accent); color: var(--bg); border-radius: 999px; padding: 2px 6px; }
.far .pin.cluster b { display: none; }

/* Panneau */
.panel { min-height: 0; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
#panel { overflow: auto; flex: 1 1 auto; min-height: 0; padding: 22px max(22px, env(safe-area-inset-right, 0px)) 32px 22px; }
.sheet-grip { display: none; }
.ph { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.ph h1 { margin: 0; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; font-weight: 600; text-wrap: balance; }
.sub { margin: 5px 0 0; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.back { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--muted); }
.back:hover { color: var(--fg); border-color: var(--accent); }
.badge { flex: 0 0 auto; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font: 600 12px var(--font-mono); color: var(--fg); }
.badge.big { width: 54px; height: 54px; font-size: 14px; }
.note { margin: 0 0 20px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 12.5px; }
.sec { margin-bottom: 24px; }
.lbl { margin: 0 0 12px; font: 500 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; font-weight: 500; }
.pill .mono { font-size: 11px; color: var(--accent); }
.pill:hover, .card:hover, .gbtn:hover { border-color: var(--accent); }
.cards { display: grid; gap: 8px; }
.card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; text-align: left; width: 100%; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.card .badge { grid-row: 1 / span 3; }
.card-n { font-weight: 600; font-size: 15px; }
.card-m { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.news { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.news-i { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.news-i:last-child { border-bottom: 0; padding-bottom: 0; }
.news-h { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.tag { font: 500 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; border: 1px solid currentColor; }
.tag.ok { color: var(--ok); }
.tag.rumor { color: var(--warn); }
.ex { font: 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.news-t { margin: 0 0 2px; font-weight: 500; text-wrap: pretty; }
.news-m { margin: 0; color: var(--muted); font-size: 12.5px; }
.tier-row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.tier-row:first-of-type { border-top: 0; padding-top: 0; }
.tier-row b { font: 500 12px var(--font-mono); color: var(--accent); padding-top: 8px; }
.tier-games { display: flex; flex-wrap: wrap; gap: 6px; }
.gbtn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; font-weight: 500; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 14px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.rows { display: grid; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; padding: 13px 0; border-top: 1px solid var(--line); align-items: center; }
.row:first-child { border-top: 0; }
.row .tile { grid-row: 1 / span 2; }
.row-n { font-weight: 500; grid-column: 2; }
.row-m { color: var(--muted); font-size: 12.5px; grid-column: 2; }
.row-r { grid-row: 1 / span 2; grid-column: 3; font: 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row.plain { grid-template-columns: minmax(0, 1fr) auto; }
.row.plain .row-n, .row.plain .row-m { grid-column: 1; }
.row.plain .row-r { grid-column: 2; }
.jersey { display: grid; place-items: center; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.jersey svg { width: min(220px, 70%); height: auto; }
.empty { color: var(--muted); }
select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.skyset { display: grid; gap: 14px; margin-bottom: 26px; }
.sky-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.sky-btns button { padding: 8px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 500; font-size: 13px; }
.sky-btns button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
.slider { display: grid; gap: 6px; }
.slider-top { display: flex; justify-content: space-between; font-size: 13px; }
.slider-top .mono { color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(12px);
  background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100% - 32px);
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 820px) {
  /* Globe plein ecran + panneau en tiroir qui remonte */
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); max-width: 100vw; overflow-x: hidden; }
  .top, .stage { max-width: 100vw; overflow-x: hidden; }
  .stage { grid-row: 2; }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
    height: 88vh; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0; box-shadow: 0 -12px 34px rgba(0, 0, 0, .55);
    transform: translateY(var(--sheet-y, calc(100% - 40vh)));
    transition: transform .34s cubic-bezier(.32, .72, 0, 1); touch-action: none; max-width: 100vw; overflow-x: hidden;
  }
  .panel.sheet-drag { transition: none; }
  .sheet-grip { display: block; flex: 0 0 auto; width: 100%; height: 26px; background: none; border: 0; position: relative; cursor: grab; }
  .sheet-grip::before { content: ""; position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 42px; height: 4px; border-radius: 3px; background: var(--muted); opacity: .6; }
  #panel { padding: 2px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .brand span, .search kbd, .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast, .pin, .stage { transition: none; } }

/* ===== Direction artistique Lobby : encre, os, signal rouge pour le direct ===== */
.brand { font: 700 28px/1 var(--font-ui); font-stretch: 75%; letter-spacing: .01em; text-transform: uppercase; }
.brand b { color: var(--muted); font-weight: 400; margin-left: 1px; }
.seg, .chip, .gbtn, .search input, .icon-btn, .ghost-btn, .card, .pill, .tile, .badge { border-radius: 8px; }
.seg { height: 46px; }
.seg-btn { font: 600 15px var(--font-ui); font-stretch: 78%; letter-spacing: .06em; text-transform: uppercase; }
.seg-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.chip { font: 600 15px var(--font-ui); font-stretch: 80%; letter-spacing: .05em; text-transform: uppercase; padding: 0 16px 0 0; gap: 12px; overflow: hidden; }
.chip .tile { width: 46px; height: 44px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: var(--surface-2); font: 700 12px var(--font-mono); letter-spacing: 0; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip[aria-pressed="true"] .tile { background: var(--on-accent); color: var(--accent); border-right-color: transparent; }
.tile.t1, .tile.t2 { color: var(--fg); border-color: var(--line); }
.tile.sm { border-radius: 6px; }
.grp { font: 600 11px var(--font-mono); }
.pin { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 5px; padding: 5px 10px 5px 8px; font: 700 13px/1 var(--font-ui); font-stretch: 80%; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
.pin:hover { background: #fff; }
.pin::before { background: var(--on-accent); }
.pin.cluster b { background: var(--on-accent); color: var(--accent); border-radius: 3px; padding: 1px 6px; font: 700 11px var(--font-mono); }
.far .pin { border-radius: 50%; background: #f4f4f2; box-shadow: 0 0 0 1px rgba(13,14,16,.9); }
.far .pin::before { display: none; }
