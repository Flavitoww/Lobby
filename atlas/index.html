<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Atlas — Lobby</title>
<meta name="description" content="La scène esport mondiale sur un globe 3D : équipes, joueurs et matchs, pays par pays.">
<meta name="theme-color" content="#0d1420">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111214'/%3E%3Cpath d='M11 8h3.5v12.5H22V24H11z' fill='%23fff'/%3E%3Ccircle cx='23' cy='10' r='2.6' fill='%23ff5a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/lobby.css">
<link rel="stylesheet" href="/atlas/atlas.css">
<script type="importmap">{"imports":{"three":"/lib/three.module.min.js"}}</script>
<style>
html,body{height:100%;overflow:hidden}
#stage{position:fixed;inset:0;background:#0d1420;transition:background 1s}
#gl{position:absolute;inset:0}
</style>
</head>
<body>
<div id="stage"><div id="gl"></div></div>
<script type="module">
import { mountAtlas } from '/atlas/atlas.js';
const u = new URLSearchParams(location.search);
mountAtlas({ stage: document.getElementById('stage'), glEl: document.getElementById('gl'), params: u, onParamsUsed: () => history.replaceState(null, '', '/atlas') });
</script>
<script>/* mesure d'audience Lobby : sans cookie, sans IP stockée */(function(){try{var k="lobbySid",s=sessionStorage.getItem(k);if(!s){s=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem(k,s)}
function send(t,x){var b=JSON.stringify(Object.assign({t:t,sid:s,page:location.pathname,ref:document.referrer,w:screen.width,h:screen.height,lang:navigator.language,tz:Intl.DateTimeFormat().resolvedOptions().timeZone},x||{}));if(navigator.sendBeacon)navigator.sendBeacon("/api/track",new Blob([b],{type:"application/json"}));else fetch("/api/track",{method:"POST",headers:{"Content-Type":"application/json"},body:b,keepalive:true})}
window.lobbyTrack=send;send("view");setInterval(function(){if(!document.hidden)send("ping")},30000);addEventListener("pagehide",function(){send("leave")})}catch(e){}})();</script>
</body>
</html>
